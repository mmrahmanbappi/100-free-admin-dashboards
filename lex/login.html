<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lex: Sign In | Hartwell &amp; Mercer LLP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/lex.css">
<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--canvas);padding:20px;position:relative;overflow:hidden}
.auth-wrap::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(27,78,216,0.12) 0%,transparent 70%);top:-100px;left:-100px;pointer-events:none}
.auth-wrap::after{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(160,120,48,0.08) 0%,transparent 70%);bottom:-100px;right:-100px;pointer-events:none}
.auth-card{background:var(--surface);border:1px solid var(--surface-3);border-radius:20px;box-shadow:var(--modal-shadow);width:100%;max-width:420px;padding:40px;position:relative;z-index:1}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;justify-content:center}
.auth-logo-mark{width:40px;height:40px;background:linear-gradient(135deg,#1B4ED8,#0EA5E9);border-radius:10px;display:flex;align-items:center;justify-content:center}
.auth-logo-mark svg{width:22px;height:22px;stroke:#fff;stroke-width:2;fill:none}
.auth-title{font-family:'Playfair Display',serif;font-size:26px;color:var(--t1);margin-bottom:6px}
.auth-sub{font-size:13px;color:var(--t2);margin-bottom:28px}
.auth-footer{text-align:center;margin-top:20px;font-size:13px;color:var(--t3)}
.auth-footer a{color:var(--brand);font-weight:600}
</style>
</head>
<body>
<div class="auth-wrap">
<div class="auth-card">
  <div class="auth-logo">
    <div class="auth-logo-mark"><svg viewBox="0 0 24 24"><path d="M12 2L3 7l9 5 9-5-9-5zM3 17l9 5 9-5M3 12l9 5 9-5"/></svg></div>
    <div><div style="font-family:'Playfair Display',serif;font-size:22px;color:var(--t1)">Le<span style="color:#C9A96E">x</span></div><div style="font-size:10px;color:var(--t3);margin-top:-2px;letter-spacing:.3px">Hartwell &amp; Mercer LLP</div></div>
    <div style="margin-left:auto"><button class="icon-btn" onclick="LEX.toggleTheme()" style="color:var(--t3)"><svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button></div>
  </div>
<div class="auth-title">Welcome back</div>
<div class="auth-sub">Sign in to your Hartwell &amp; Mercer LLP workspace</div>
<div class="form-group"><label class="form-label">Email address</label><input class="form-input" type="email" placeholder="you@hartwell-mercer.com" autofocus /></div>
<div class="form-group"><label class="form-label" style="display:flex;justify-content:space-between"><span>Password</span><a href="forgot-password.html" style="color:var(--brand);font-size:12px">Forgot password?</a></label><input class="form-input" type="password" placeholder="••••••••" /></div>
<div style="display:flex;align-items:center;gap:8px;margin-bottom:20px"><input type="checkbox" id="rem" style="width:15px;height:15px;cursor:pointer"><label for="rem" style="font-size:13px;color:var(--t2);cursor:pointer">Remember me for 30 days</label></div>
<button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;font-size:14px" onclick="location.href='index.html'">Sign in to Lex</button>
<div style="display:flex;align-items:center;gap:12px;margin:20px 0"><div style="flex:1;height:1px;background:var(--surface-3)"></div><span style="font-size:12px;color:var(--t3)">or</span><div style="flex:1;height:1px;background:var(--surface-3)"></div></div>
<button class="btn btn-ghost" style="width:100%;justify-content:center;font-size:13.5px;padding:10px"><svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>Continue with SSO</button>
<div class="auth-footer" style="margin-top:24px">Two-factor authentication will be required for partners. <a href="#">Learn more</a></div>
</div>
</div>
<script src="assets/js/lex.js"></script>
</body>
</html>
