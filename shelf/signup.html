<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shelf: Create your store | Commerce Dashboard</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="Two minutes to your first order.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F6B4F'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='700' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/shelf.css">
<script>try{var t=localStorage.getItem('shelf.theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<div class="auth">
  <div class="auth-form">
    <div class="auth-inner">
      <div style="display:flex;align-items:center;gap:11px;margin-block-end:30px">
        <span class="brand-mark">N</span><span class="brand-name">Northbay</span>
      </div>
      <h1 style="margin-block-end:8px">Create your store</h1>
      <p style="font-size:13.5px;color:var(--ink-3);margin-block-end:26px">Two minutes to your first order.</p>
      <div class="field"><label class="field-label" for="s-n">Your name</label>
        <input class="input" id="s-n" placeholder="Amara Ellis" autocomplete="name"></div>
      <div class="field"><label class="field-label" for="s-e">Work email</label>
        <input class="input" id="s-e" type="email" placeholder="you@company.com" autocomplete="email"></div>
      <div class="field"><label class="field-label" for="s-p">Password</label>
        <input class="input" id="s-p" type="password" autocomplete="new-password">
        <span class="field-hint">At least 12 characters.</span></div>
      <div class="field"><label class="field-label" for="s-d">Store domain</label>
        <input class="input" id="s-d" placeholder="yourstore.com"></div>
      <label style="display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink-2);margin-block-end:22px">
        <input class="cbx" type="checkbox"> I agree to the terms and the data processing addendum</label>
      <button class="btn btn--primary" style="width:100%;height:44px" onclick="location.href='index.html'">Create store</button>
    </div>
  </div>
  <div class="auth-side">
    <p style="font-size:13.5px;color:var(--ink-3);max-width:32ch;line-height:1.6">Northbay Supply Co., last 30 days.</p>
    <div class="auth-stat"><div class="kpi-lab">Revenue</div><div class="kpi-val">$184,290</div></div>
    <div class="auth-stat"><div class="kpi-lab">Orders</div><div class="kpi-val">3,412</div></div>
    <div class="auth-stat"><div class="kpi-lab">Repeat rate</div><div class="kpi-val">31.4%</div></div>
  </div>
</div>
</body>
</html>
