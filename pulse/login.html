<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse: Login | NovaBuild Inc.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/pulse.css">
<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--canvas);padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--surface-3);border-radius:var(--r-2xl);width:100%;max-width:420px;padding:40px;box-shadow:var(--modal-shadow)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center}
.auth-title{font-size:22px;font-weight:800;color:var(--t1);text-align:center;margin-bottom:6px;letter-spacing:-.4px}
.auth-sub{font-size:13.5px;color:var(--t3);text-align:center;margin-bottom:28px}
.auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--surface-3)}
.auth-divider span{font-size:12px;color:var(--t4)}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px;border:1px solid var(--surface-3);border-radius:var(--r-md);background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--t1);cursor:pointer;transition:all .15s;font-family:inherit;margin-bottom:8px}
.google-btn:hover{background:var(--surface-3)}
.auth-footer{text-align:center;font-size:13px;color:var(--t3);margin-top:20px}
.auth-footer a{color:var(--brand);font-weight:600}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark" style="width:36px;height:36px"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" stroke-width="2"/></svg></div>
      <span style="font-size:22px;font-weight:800;color:var(--t1)">Pulse</span>
    </div>
    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Sign in to your NovaBuild dashboard</div>
    <button class="google-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
    <div class="auth-divider"><span>or continue with email</span></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" placeholder="you@company.com" value="alex@novabuild.io"></div>
    <div class="form-group"><label class="form-label" style="display:flex;justify-content:space-between">Password<a href="forgot-password.html" style="color:var(--brand);font-size:12px;font-weight:600">Forgot password?</a></label><input class="form-input" type="password" placeholder="Your password" value="••••••••••••"></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:20px;cursor:pointer"><input type="checkbox" checked>Keep me signed in</label>
    <a href="index.html" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;font-size:14px">Sign In</a>
    <div class="auth-footer">No account? <a href="signup.html">Create one free</a></div>
  </div>
</div>
<div class="toast-container"></div>
<script src="assets/js/pulse.js"></script>
</body></html>
