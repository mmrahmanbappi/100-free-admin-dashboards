<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse: Reset Password | NovaBuild Inc.</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/pulse.css">
<style>
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--canvas);padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--surface-3);border-radius:var(--r-2xl);width:100%;max-width:420px;padding:40px;box-shadow:var(--modal-shadow)}
.auth-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center}
.auth-title{font-size:22px;font-weight:800;color:var(--t1);text-align:center;margin-bottom:6px;letter-spacing:-.4px}
.auth-sub{font-size:13.5px;color:var(--t3);text-align:center;margin-bottom:28px}
.auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--surface-3)}
.auth-divider span{font-size:12px;color:var(--t4)}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px;border:1px solid var(--surface-3);border-radius:var(--r-md);background:var(--surface-2);font-size:13.5px;font-weight:600;color:var(--t1);cursor:pointer;transition:all .15s;font-family:inherit;margin-bottom:8px}
.google-btn:hover{background:var(--surface-3)}
.auth-footer{text-align:center;font-size:13px;color:var(--t3);margin-top:20px}
.auth-footer a{color:var(--brand);font-weight:600}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><div class="logo-mark" style="width:36px;height:36px"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" stroke-width="2"/></svg></div><span style="font-size:22px;font-weight:800;color:var(--t1)">Pulse</span></div>
    <div style="width:52px;height:52px;border-radius:var(--r-xl);background:var(--brand-lt);display:flex;align-items:center;justify-content:center;margin:0 auto 20px"><svg viewBox="0 0 24 24" style="width:24px;height:24px;stroke:var(--brand);stroke-width:1.8;fill:none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></div>
    <div class="auth-title">Forgot your password?</div>
    <div class="auth-sub">Enter your email and we'll send you a reset link within 2 minutes.</div>
    <div class="form-group"><label class="form-label">Email Address</label><input class="form-input" type="email" placeholder="you@company.com"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;font-size:14px" onclick="PULSE.showToast('Reset link sent to your email','success')">Send Reset Link</button>
    <div class="auth-footer"><a href="login.html">Back to sign in</a></div>
  </div>
</div>
<div class="toast-container"></div>
<script src="assets/js/pulse.js"></script>
</body></html>
